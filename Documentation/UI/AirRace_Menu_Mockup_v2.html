<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Air Race Ocean Run — Menú, variante 2</title>
<style>
:root{--navy:#06152de8;--blue:#092956;--red:#e91f3d;--yellow:#ffcf26;--ice:#c9f5ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#071321;color:#f4f8ff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.screen{width:min(1280px,100%);aspect-ratio:16/9;position:relative;overflow:hidden;border:1px solid #a4d3e866;border-radius:12px;background:#0c2c49 url('AirRace_Level01_Angle_Reference.png') center/cover no-repeat;box-shadow:0 28px 90px #000a,0 0 0 6px #0a1a2d}
.screen:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#06182d91 0%,#06182d48 28%,transparent 53%,#06172b14 100%),linear-gradient(180deg,#07172c35,transparent 25%,transparent 76%,#06172c98)}
.screen:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(145deg,#ffbb5522,transparent 45%);mix-blend-mode:screen}
.brand-card{position:absolute;z-index:1;left:5%;top:8%;width:auto;padding:0;text-shadow:0 3px 18px #00172c}
.brand-card h1{margin:0 0 9px;font-size:clamp(29px,4.5vw,58px);line-height:.9;font-weight:1000;font-style:italic;letter-spacing:-.06em}.brand-card h1 span{color:var(--yellow)}.subtitle{display:block;font-size:clamp(9px,.95vw,13px);font-weight:850;letter-spacing:.22em;color:#e2f1f7}.subtitle i{display:none}
.menu-card{z-index:1;position:absolute;left:5%;top:43%;width:24%;min-width:190px;padding:0;border:0;background:transparent;box-shadow:none}
.menu-card:before{content:none}
.menu-label{display:none}.button{display:flex;width:100%;height:clamp(40px,5.5vw,60px);align-items:center;justify-content:space-between;margin:7% 0;padding:0 7%;border-radius:5px;color:#fff;font-size:clamp(11px,1.2vw,16px);font-weight:900;letter-spacing:.12em;cursor:pointer;transition:transform .15s,filter .15s;text-shadow:0 1px 5px #001}.button:hover{transform:translateX(5px);filter:brightness(1.2)}.play{background:#df173bbf;border:1px solid #ff9cacd1;box-shadow:0 5px 17px #0016}.options{background:#08234bb8;border:1px solid #f2cf58d1}.exit{background:#071a35a1;border:1px solid #b3ccddad}.arrow{font-size:1.3em;color:#fff}
.controls{position:absolute;right:5.3%;bottom:8%;z-index:1;display:flex;gap:22px;font-size:clamp(8px,.78vw,11px);font-weight:800;letter-spacing:.12em;color:#d2e8f2}.controls b{color:var(--yellow);margin-left:5px}
.status{position:absolute;left:4.8%;bottom:8%;z-index:1;display:flex;gap:9px;align-items:center;color:#e1edf2;font-size:clamp(8px,.75vw,10px);font-weight:800;letter-spacing:.16em;text-shadow:0 2px 6px #001}.dot{width:7px;height:7px;background:#5ff4d1;border-radius:50%;box-shadow:0 0 10px #5ff4d1}
.options{font-family:inherit}.options-view{display:none;position:absolute;z-index:4;inset:8%;padding:4% 6%;border:1px solid #d5eff18c;border-radius:14px;background:linear-gradient(145deg,#071b35f2,#061329f5);box-shadow:inset 0 0 0 1px #ffffff12,0 18px 60px #000b;backdrop-filter:blur(15px)}.options-view.active{display:block}.options-view h2{margin:0 0 3%;font-size:clamp(24px,3vw,40px);font-style:italic;letter-spacing:.05em}.tabs{display:flex;gap:12px;border-bottom:1px solid #62829a;padding-bottom:12px}.tab{padding:10px 22px;border:1px solid #7899b2;border-radius:5px;background:#0a2140;color:white;font-weight:900;letter-spacing:.12em;cursor:pointer}.tab.active{background:var(--yellow);color:#06152c;border-color:#ffe98d}.rows{width:min(680px,90%);margin:4% auto}.row{display:grid;grid-template-columns:140px 1fr 40px;align-items:center;gap:18px;margin:22px 0;font-size:clamp(11px,1vw,14px);font-weight:850;letter-spacing:.08em}.bar{height:8px;border-radius:8px;background:#54708a;position:relative}.bar:before{content:"";display:block;width:var(--fill);height:100%;border-radius:8px;background:linear-gradient(90deg,var(--yellow),#ffe796)}.bar:after{content:"";position:absolute;left:var(--fill);top:50%;width:17px;height:17px;border:2px solid #d7edfa;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}.back{display:block;margin:4% auto 0;padding:11px 28px;border:1px solid var(--yellow);border-radius:5px;background:#0b2448;color:white;font-weight:900;letter-spacing:.13em;cursor:pointer}
.toast{position:absolute;z-index:5;left:50%;bottom:16%;transform:translate(-50%,15px);padding:12px 20px;border:1px solid #a8d4df;border-radius:7px;background:#061a33ee;opacity:0;transition:.2s;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){body{padding:8px}.screen{aspect-ratio:4/3}.brand-card{left:4%;top:4%;width:43%}.brand-card h1{font-size:clamp(22px,6vw,40px)}.menu-card{left:4%;top:44%;width:39%;min-width:0}.button{height:35px;margin:6% 0;font-size:10px}.controls,.status{display:none}.options-view{inset:4%;padding:6%}.rows{margin:7% auto}.row{grid-template-columns:85px 1fr 28px;gap:8px;margin:17px 0;font-size:10px}.tab{padding:8px 13px}}
</style>
</head>
<body>
<main class="screen" aria-label="Mockup del menú sobre captura real del juego">
  <header class="brand-card"><h1>AIR <span>RACE</span></h1><div class="subtitle">OCEAN FLIGHT · NIVEL 01</div></header>
  <nav class="menu-card" aria-label="Menú principal"><button class="button play" onclick="showToast('Comenzar carrera')"><span>JUGAR</span><span class="arrow">›</span></button><button class="button options" id="openOptions"><span>OPCIONES</span><span>⚙</span></button><button class="button exit" onclick="showToast('Salir del juego')"><span>SALIR</span><span class="arrow">↗</span></button></nav>
  <section class="options-view" id="optionsView" aria-label="Opciones de audio"><h2>OPCIONES</h2><div class="tabs"><button class="tab active">AUDIO</button><button class="tab">CONTROLES</button></div><div class="rows"><div class="row"><span>GENERAL</span><div class="bar" style="--fill:78%"></div><span>78</span></div><div class="row"><span>MÚSICA</span><div class="bar" style="--fill:62%"></div><span>62</span></div><div class="row"><span>EFECTOS</span><div class="bar" style="--fill:86%"></div><span>86</span></div></div><button class="back" id="back">‹ &nbsp; VOLVER</button></section>
  <div class="toast" id="toast" role="status"></div>
</main>
<script>
const options=document.getElementById('optionsView');document.getElementById('openOptions').onclick=()=>options.classList.add('active');document.getElementById('back').onclick=()=>options.classList.remove('active');document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active')});let toastTimer;function showToast(message){const t=document.getElementById('toast');t.textContent=message+' · vista de muestra';t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1600)}
</script>
</body></html>
